name: Compilar y Firmar con SignPath

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Compilar y Firmar Binarios de Windows
    runs-on: windows-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Ejecutable Portable (BingHo.exe)
        run: npm run build:single

      - name: Preparar Artefacto para Firma
        run: |
          mkdir unsigned-binaries
          Copy-Item dist\BingHo.exe unsigned-binaries\BingHo.exe
          Compress-Archive -Path unsigned-binaries\BingHo.exe -DestinationPath unsigned-binaries.zip

      - name: Enviar Solicitud de Firma a SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        id: signpath
        uses: SignPath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          org-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: 'bingho'
          signing-policy-slug: 'release-signing'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          unsigned-artifact-zip: 'unsigned-binaries.zip'
          signed-artifact-zip: 'signed-binaries.zip'

      - name: Descomprimir Binario Firmado (Si SignPath está activo)
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Expand-Archive -Path signed-binaries.zip -DestinationPath dist_signed -Force
          Copy-Item dist_signed\BingHo.exe dist\BingHo.exe -Force
          Compress-Archive -Path dist\BingHo.exe -DestinationPath dist\BingHo-${{ github.ref_name }}-Windows-x64.zip -Force

      - name: Publicar / Actualizar Release en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/BingHo.exe
            dist/BingHo-*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
